<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PlanetFOSS Store-Bilder Tablet</title>
<!-- Play-Store-Bilder für Tablets (2026-11-22): fünf Bilder 2560 x 1440 (16:9) als ein Panorama, DE und EN.
     Gleiche Texte und Reihenfolge wie index.html (Handy); gebaut von build.sh, ?lang=en für Englisch. -->
<style>
@font-face{font-family:"Space Grotesk";font-weight:700;src:url(space-grotesk-bold.woff2)}
@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(jetbrains-mono-bold.woff2)}
:root{--space950:#070A1A;--space900:#0B1026;--nebula300:#B3A4FF;--aurora:#2DD4BF;--star:#FFC94D;--moon:#F5F6FB}
html,body{margin:0;background:var(--space950)}
.strip{position:relative;width:12800px;height:1440px;overflow:hidden;
  background:linear-gradient(180deg,var(--space950) 0%,var(--space900) 55%,#120F33 100%)}
#sky{position:absolute;inset:0}
.slide{position:absolute;top:0;width:2560px;height:1440px;overflow:hidden}
.cap{position:absolute;left:150px;width:640px;top:50%;transform:translateY(-50%)}
.kicker{font:700 40px/1 "JetBrains Mono",monospace;letter-spacing:.18em;color:var(--star);
  display:flex;align-items:center;gap:20px;text-transform:uppercase}
.kicker svg{width:40px;height:40px}
h1{margin:36px 0 0;font:700 104px/1.04 "Space Grotesk",sans-serif;color:var(--moon);letter-spacing:-.015em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--nebula300),var(--aurora));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:22px;margin-bottom:64px;font:700 64px/1 "Space Grotesk";color:var(--moon)}
.brand img{height:76px}
.brand b{background:linear-gradient(90deg,var(--nebula300),var(--aurora));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Tablet quer, rechts und unten angeschnitten */
.tab{position:absolute;left:900px;top:200px;width:1900px;border-radius:64px;padding:22px;
  background:linear-gradient(160deg,#2A3160,#11163A 60%);box-shadow:0 0 0 2px rgba(179,164,255,.25),
  0 50px 140px rgba(124,92,255,.35),0 0 260px rgba(45,212,191,.12)}
.tab img{display:block;width:100%;border-radius:44px}
.duo .a{left:880px;top:120px;width:1500px;transform:rotate(-4deg)}
.duo .b{left:1180px;top:420px;width:1500px;transform:rotate(3deg)}
</style>
</head>
<body>
<div class="strip">
  <svg id="sky" width="12800" height="1440" viewBox="0 0 12800 1440">
    <defs>
      <radialGradient id="neb" r=".5"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".42"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
      <radialGradient id="aur" r=".5"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".22"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
      <radialGradient id="sn" r=".5"><stop offset="0" stop-color="#FFC94D" stop-opacity=".30"/><stop offset="1" stop-color="#FFC94D" stop-opacity="0"/></radialGradient>
      <linearGradient id="ring" x1="0" x2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
    </defs>
    <ellipse cx="1700" cy="900" rx="1500" ry="700" fill="url(#neb)"/>
    <ellipse cx="900" cy="700" rx="700" ry="420" fill="url(#sn)"/>
    <ellipse cx="4600" cy="1100" rx="1500" ry="600" fill="url(#aur)"/>
    <ellipse cx="7300" cy="850" rx="1600" ry="700" fill="url(#neb)"/>
    <ellipse cx="10100" cy="1000" rx="1500" ry="650" fill="url(#aur)"/>
    <ellipse cx="11800" cy="800" rx="1300" ry="600" fill="url(#neb)"/>
    <!-- eine Umlaufbahn quer über alle Bilder -->
    <ellipse cx="6400" cy="820" rx="6900" ry="430" transform="rotate(-3 6400 820)" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".5"/>
    <g id="stars"></g>
  </svg>

  <section class="slide" style="left:0">
    <div class="cap">
      <div class="brand"><img src="bildmarke.svg" alt=""><span>Planet<b>FOSS</b></span></div>
      <div class="kicker"><svg viewBox="-1 -1 2 2"><path d="M0-1Q.12-.12 1 0Q.12 .12 0 1Q-.12 .12-1 0Q-.12-.12 0-1Z" fill="currentColor"/></svg><span>Supernovas</span></div>
      <h1>Was die Linux-Welt <em>gerade bewegt</em></h1>
    </div>
    <div class="tab"><img src="shots/tab-de-supernova.jpg" alt=""></div>
  </section>

  <section class="slide" style="left:2560px">
    <div class="cap">
      <div class="kicker">Aktuell</div>
      <h1>Über 200 Quellen in <em>einem Strom</em></h1>
    </div>
    <div class="tab"><img src="shots/tab-de-aktuell.jpg" alt=""></div>
  </section>

  <section class="slide" style="left:5120px">
    <div class="cap">
      <div class="kicker">Logbuch · 6 Uhr</div>
      <h1>Jeden Morgen <em>dein Logbuch</em></h1>
    </div>
    <div class="tab"><img src="shots/tab-de-logbuch.jpg" alt=""></div>
  </section>

  <section class="slide" style="left:7680px">
    <div class="cap">
      <div class="kicker">Themen</div>
      <h1>Ein Thema, <em>alle Quellen</em></h1>
    </div>
    <div class="tab"><img src="shots/tab-de-thema-gnome.jpg" alt=""></div>
  </section>

  <section class="slide duo" style="left:10240px">
    <div class="cap">
      <div class="kicker">Open Source · GPL</div>
      <h1>Freie Software, <em>hell oder dunkel</em></h1>
    </div>
    <div class="tab a"><img src="shots/tab-de-suche.jpg" alt=""></div>
    <div class="tab b"><img src="shots/tab-de-aktuell-dunkel.jpg" alt=""></div>
  </section>
</div>
<script>
let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const g=document.getElementById('stars');let h='';
for(let i=0;i<480;i++){const x=r()*12800,y=r()*1440,a=.25+r()*.6,rad=r()<.08?3.6:1.3+r()*1.3;
  h+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad.toFixed(1)}" fill="#fff" opacity="${a.toFixed(2)}"/>`}
g.innerHTML=h;
const EN = [
  ["Supernovas", "What the Linux world <em>is talking about</em>"],
  ["Latest", "200+ sources in <em>one stream</em>"],
  ["Logbook · 6 AM", "Every morning, <em>your logbook</em>"],
  ["Topics", "One topic, <em>every source</em>"],
  ["Open Source · GPL", "Free software, <em>light or dark</em>"],
];
if (new URLSearchParams(location.search).get("lang") === "en") {
  document.documentElement.lang = "en";
  document.querySelectorAll(".slide").forEach((sl, i) => {
    const k = sl.querySelector(".kicker span") || sl.querySelector(".kicker");
    k.textContent = EN[i][0];
    sl.querySelector("h1").innerHTML = EN[i][1];
  });
  document.querySelectorAll(".tab img").forEach(im => im.src = im.getAttribute("src").replace("shots/tab-de-", "shots/tab-en-"));
}
</script>
</body>
</html>
